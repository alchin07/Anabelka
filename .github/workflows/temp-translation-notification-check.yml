name: Temporary translation notification verification

on:
  push:
    branches:
      - feature/unified-notifications

permissions:
  contents: read

jobs:
  notifications:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing contracts and PHP bridge
        run: |
          node tests/anabelka_notifications_contract.test.mjs
          node tests/category_manager_contract.test.mjs
          node tests/delivery_notifications_contract.test.mjs
          php tests/anabelka_flash_runtime.php
      - name: Translation notification contracts when present
        run: |
          if [ -f tests/translation_notifications_contract.test.mjs ]; then
            node tests/translation_notifications_contract.test.mjs
          fi
      - name: JavaScript syntax
        run: find js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Source snapshot
        if: always()
        run: git archive --format=tar HEAD -o "$RUNNER_TEMP/anabelka-source.tar"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notification-verification-source
          path: ${{ runner.temp }}/anabelka-source.tar
          retention-days: 1
          if-no-files-found: error
