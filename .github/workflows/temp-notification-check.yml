name: Temporary notification verification

on:
  push:
    branches:
      - feature/unified-notifications

jobs:
  notifications:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Contract tests
        run: |
          node tests/anabelka_notifications_contract.test.mjs
          node tests/category_manager_contract.test.mjs
          node tests/delivery_notifications_contract.test.mjs
      - name: JavaScript syntax
        run: |
          node --check js/anabelka-notifications.js
          node --check js/admin-categories.js
          node --check js/admin-category-ai-translation.js
          node --check js/admin-delivery/common.js
          node --check js/admin-delivery/add.js
          node --check js/admin-delivery/add-service.js
          node --check js/admin-delivery/add-option.js
          node --check js/admin-delivery/edit.js
          node --check js/admin-delivery/delete.js
          node --check js/admin-delivery/toggle.js
          node --check js/admin-delivery-ai-translation.js
