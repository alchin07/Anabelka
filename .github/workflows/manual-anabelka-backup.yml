name: Manual Anabelka backup

on:
  push:
    paths:
      - '.github/workflows/manual-anabelka-backup.yml'

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload project archive
        uses: actions/upload-artifact@v4
        with:
          name: Anabelka-2026-09-07
          path: |
            .
            !.git/**
            !.github/workflows/manual-anabelka-backup.yml
          include-hidden-files: true
          compression-level: 9
          retention-days: 30
